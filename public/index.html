<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>headphonelessrecording.com</title>
<meta name="description" content="Upload a track and record a new part over it with your speakers on. The track is removed from your mic as it plays, so you never need headphones. Coming soon.">
<meta property="og:title" content="headphonelessrecording.com">
<meta name="theme-color" content="#E6EAED">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body { min-height: 100svh; display: grid; grid-template-rows: 1fr auto; }
  .splash { display: grid; align-content: center; justify-items: center; text-align: center; padding: 2rem 1rem; gap: 1.5rem; }
  .splash h1 { font-size: clamp(1.9rem, 7.2vw, 6.2rem); letter-spacing: -.03em; overflow-wrap: anywhere; }
  .splash h1 .tld { font-weight: 300; }
  .splash canvas { width: min(56rem, 100%); height: 120px; display: block; }
  .splash p { margin: 0; color: var(--slate); font-size: clamp(1.05rem, 1.8vw, 1.3rem); max-width: 32ch; }
  .splash .links { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  .splash .submit, .splash .top-cta { text-decoration: none; display: inline-block; }
  .splash .top-cta { padding: .8rem 1.4rem; font-size: 1.05rem; }
  .foot { justify-content: center; }
</style>
</head>
<body>
<main class="splash">
  <h1>headphonelessrecording<span class="tld">.com</span></h1>
  <canvas id="line" height="120" aria-hidden="true"></canvas>
  <p>Upload a track. Record over it with your speakers on. No headphones. Coming soon.</p>
  <div class="links">
    <a class="submit" href="/about.html#join">Join the waitlist</a>
    <a class="top-cta" href="/about.html">What is it?</a>
  </div>
</main>
<footer class="foot"><span>© <span id="year">2026</span> Headphoneless</span></footer>
<script>
(() => {
  document.getElementById('year').textContent = new Date().getFullYear();
  const c = document.getElementById('line'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hash = (n) => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
  const voice = (x) => { const pos = x * 0.75, n = Math.floor(pos), u = pos - n; if (hash(n) < 0.22) return 0;
    const env = Math.sin(Math.PI * u) ** 0.7 * (0.55 + 0.45 * hash(n + 7)), f = 15 + 9 * hash(n + 3) + 0.6 * Math.sin(x * 5.5);
    return env * (Math.sin(x * f) + 0.4 * Math.sin(x * f * 2 + 1) + 0.15 * Math.sin(x * f * 3 + 2)) * 0.8; };
  let t = 0;
  const draw = () => {
    const dpr = Math.min(2, devicePixelRatio || 1), w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    g.beginPath();
    for (let px = 0; px <= w; px += 2) {
      const edge = Math.min(1, px / (w * 0.12), (w - px) / (w * 0.12));   // fade in and out at the ends
      const y = h / 2 - voice(t + px / w * 12) * h * 0.38 * edge; px ? g.lineTo(px, y) : g.moveTo(px, y);
    }
    g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--voice').trim(); g.lineWidth = 2.5; g.lineJoin = 'round'; g.stroke();
  };
  const loop = () => { t += 0.01; draw(); requestAnimationFrame(loop); };
  reduce ? draw() : loop();
  addEventListener('resize', draw);
})();
</script>
</body>
</html>
